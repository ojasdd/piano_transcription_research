[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "piano-prior-transcriber"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "librosa", "pretty_midi", "PyYAML"]
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

